services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev
      POSTGRES_DB: nexus
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./docker/timescaledb/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 10s
      timeout: 5s
      retries: 3

  nexus-sentiment:
    build:
      context: .
      dockerfile: packages/nexus-sentiment/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/app/data:ro
    ports:
      - "8081:8081"
    environment:
      - NEXUS_REDIS_URL=redis://redis:6379
      - NEXUS_TIMESCALEDB_DSN=postgresql://nexus:nexus_dev@timescaledb:5432/nexus

volumes:
  redis-data:
  timescaledb-data:
