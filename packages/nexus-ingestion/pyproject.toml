[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-ingestion"
version = "0.1.0"
description = "Data ingestion service for the Nexus trading platform"
requires-python = ">=3.10"
dependencies = [
    "nexus-common",
    "ccxt>=4.0",
    "asyncpg>=0.29",
    "aiohttp>=3.9",
    "feedparser>=6.0",
    "fastapi>=0.110",
    "tomli>=2.0; python_version < '3.11'",
    "uvicorn>=0.27",
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "hypothesis>=6.0",
    "testcontainers>=3.7",
    "syrupy>=4.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
