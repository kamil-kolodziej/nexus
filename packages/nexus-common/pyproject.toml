[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-common"
version = "0.1.0"
description = "Shared schemas, config, and utilities for the Nexus trading platform"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "redis[hiredis]>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "hypothesis>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
