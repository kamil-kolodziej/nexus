[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-sentiment"
version = "0.1.0"
description = "Sentiment analysis pipeline for the Nexus trading platform"
requires-python = ">=3.10"
dependencies = [
    "nexus-common",
    "redis[hiredis]>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "vaderSentiment>=3.3",
    "asyncpg>=0.29",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "structlog>=21.5",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.optional-dependencies]
finbert = [
    "transformers>=4.40",
    "torch>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "syrupy>=4.0",
    "httpx>=0.27",
    "testcontainers>=3.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
