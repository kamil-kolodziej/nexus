[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = [
    "packages/nexus-common/tests",
    "packages/nexus-ingestion/tests",
    "packages/nexus-sentiment/tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "ASYNC",# flake8-async (asyncio correctness)
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",  # assert statements — used in tests
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B", "ASYNC"]  # relax security/bugbear/async rules in test files
"**/adapters/exchange_adapter.py" = ["B008"]  # SecretStr("") defaults are intentional

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
explicit_package_bases = true
mypy_path = "packages/nexus-common:packages/nexus-ingestion:packages/nexus-sentiment"
# pydantic plugin for model-aware type checking
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "aiohttp.*",
    "asyncpg.*",
    "ccxt.*",
    "ccxt.pro.*",
    "feedparser.*",
    "nexus_common.*",  # local package; not installable in pre-commit's isolated env
    "tomli.*",
    "uvicorn.*",
    "uvloop.*",
    "testcontainers.*",
    "vaderSentiment.*",
    "transformers.*",
    "torch.*",
    "yaml.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = [
    "B101",  # assert — used in tests
    "B603",  # subprocess without shell — ccxt uses this internally
]

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]

[tool.coverage.run]
branch = true
source = [
    "nexus_common",
    "nexus_ingestion",
    "nexus_sentiment",
]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/main.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "\\.\\.\\.",
    "raise NotImplementedError",
]

[tool.coverage.paths]
nexus_common = ["packages/nexus-common/nexus_common"]
nexus_ingestion = ["packages/nexus-ingestion/nexus_ingestion"]
nexus_sentiment = ["packages/nexus-sentiment/nexus_sentiment"]
