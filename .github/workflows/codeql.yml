name: CodeQL

# First-party SAST. Catches dataflow/taint bugs (injection into order paths,
# unsafe deserialization) that bandit's pattern matching misses. Findings land
# in the repository Security tab as code-scanning alerts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan so newly published query packs flag old code.
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload CodeQL results
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0
        with:
          languages: python
          # security-extended adds higher-recall security queries beyond the default set.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0
        with:
          category: "/language:python"
