[exchange]
id = "binance"
sandbox = true
# API credentials should be set via environment variables:
# NEXUS_EXCHANGE_API_KEY, NEXUS_EXCHANGE_API_SECRET
subscribed_assets = ["BTC/USDT"]

[redis]
url = "redis://localhost:6379"
buffer_max = 10000
market_events_stream = "nexus:market-events"
news_events_stream = "nexus:news-events"
health_events_stream = "nexus:ingestion-health-events"
market_events_maxlen = 100000
news_events_maxlen = 10000
health_events_maxlen = 5000

[timescaledb]
dsn = "postgresql://nexus:nexus_dev@localhost:5432/nexus"
batch_size = 500
flush_interval = 5.0
queue_maxsize = 50000

[news]
poll_interval = 300
# Uncomment and repeat to add news sources:
# [[news.sources]]
# name = "coindesk-rss"
# type = "rss"
# url = "https://www.coindesk.com/arc/outboundfeeds/rss/"

[monitoring]
health_host = "127.0.0.1"
health_port = 8080
gap_threshold = 60
timestamp_tolerance = 60
malformed_rate_threshold = 2
# log_env = "production"  # "development" → human-readable console; "production" → JSON (default)
# Override via env var: NEXUS_LOG_ENV=development

[sentiment]
processor_type = "vader"               # "vader" (default) or "finbert" (requires [finbert] extra)
input_stream = "nexus:news-events"
output_stream = "nexus:sentiment-events"
health_stream = "nexus:sentiment-health-events"
consumer_group = "nexus-sentiment-group"
block_timeout = 5000                   # ms to block on XREADGROUP
pending_claim_threshold = 300          # seconds before pending message is claimed
claim_sweep_interval = 60             # seconds between XAUTOCLAIM sweeps
active_assets = ["BTC/USDT"]
asset_dictionary_path = "data/asset_dictionary.yaml"
output_maxlen = 50000
health_maxlen = 5000
batch_size = 500                       # TimescaleDB batch size
flush_interval = 5.0                   # TimescaleDB flush interval (seconds)
health_host = "127.0.0.1"
health_port = 8081                     # 8081 to avoid conflict with ingestion on 8080
max_fan_out = 50                       # max assets per article fan-out
# log_env = "production"              # Override via NEXUS_LOG_ENV

[supervisor]
max_restart_attempts = 10
restart_backoff_base = 1.0
restart_backoff_max = 60.0
