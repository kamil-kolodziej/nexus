services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev  # pragma: allowlist secret
      POSTGRES_DB: nexus
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./docker/timescaledb/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 10s
      timeout: 5s
      retries: 3

  nexus-ingestion:
    build:
      context: .
      dockerfile: packages/nexus-ingestion/Dockerfile
    env_file: .env
    environment:
      NEXUS_REDIS_URL: redis://redis:6379
      NEXUS_TIMESCALEDB_DSN: postgresql://nexus:nexus_dev@timescaledb:5432/nexus  # pragma: allowlist secret
      NEXUS_HEALTH_HOST: "0.0.0.0"
      NEXUS_CONFIG_FILE: /app/config.toml
    volumes:
      - ./config.toml:/app/config.toml:ro
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  nexus-sentiment:
    build:
      context: .
      dockerfile: packages/nexus-sentiment/Dockerfile
      args:
        NEXUS_PROCESSOR_TYPE: ${NEXUS_PROCESSOR_TYPE:-vader}
    environment:
      NEXUS_REDIS_URL: redis://redis:6379
      NEXUS_TIMESCALEDB_DSN: postgresql://nexus:nexus_dev@timescaledb:5432/nexus  # pragma: allowlist secret
      NEXUS_CONFIG_FILE: /app/config.toml
      NEXUS_PROCESSOR_TYPE: ${NEXUS_PROCESSOR_TYPE:-vader}
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/app/data:ro
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  timescaledb-data:
